dataset_name: claims
version: "1.1.0"
description: "Data cleaning configuration for Medicare-style claims dataset"

# Missing value representations to normalize to standard missing
null_representations:
  - ""
  - " "
  - "NULL"
  - "null"
  - "None"
  - "NONE"
  - "N/A"
  - "NA"
  - "NaN"
  - "nan"
  - "."

canonical_null: ""

# Mandatory fields (must not be silently repaired/fabricated if missing)
mandatory_fields:
  - BENE_ID
  - CLM_ID
  - CLM_LINE_NUM
  - NCH_CLM_TYPE_CD
  - CLM_FROM_DT
  - CLM_THRU_DT
  - PRVDR_NUM
  - CLM_PMT_AMT

# Date standardization
canonical_date_format: "%Y-%m-%d"
accepted_date_formats:
  - "%d-%b-%Y"
  - "%Y-%m-%d"
  - "%Y%m%d"

date_fields:
  - CLM_FROM_DT
  - CLM_THRU_DT
  - NCH_WKLY_PROC_DT
  - FI_CLM_PROC_DT
  - CLM_ADMSN_DT
  - NCH_BENE_DSCHRG_DT
  - NCH_VRFD_NCVRD_STAY_FROM_DT
  - NCH_VRFD_NCVRD_STAY_THRU_DT
  - NCH_ACTV_OR_CVRD_LVL_CARE_THRU
  - NCH_BENE_MDCR_BNFTS_EXHTD_DT_I
  - PRCDR_DT1
