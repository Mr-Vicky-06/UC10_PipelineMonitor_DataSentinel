categorical_fields:
  - NCH_NEAR_LINE_REC_IDENT_CD
  - NCH_CLM_TYPE_CD
  - CLAIM_QUERY_CODE
  - CLM_FAC_TYPE_CD
  - CLM_SRVC_CLSFCTN_TYPE_CD
  - CLM_FREQ_CD
  - CLM_MDCR_NON_PMT_RSN_CD
  - NCH_PRMRY_PYR_CD
  - FI_CLM_ACTN_CD
  - PRVDR_STATE_CD
  - CLM_MCO_PD_SW
  - PTNT_DSCHRG_STUS_CD
  - CLM_PPS_IND_CD
  - CLM_IP_ADMSN_TYPE_CD
  - CLM_SRC_IP_ADMSN_CD
  - NCH_PTNT_STATUS_IND_CD
  - CLM_DRG_CD
  - CLM_DRG_OUTLIER_STAY_CD

# Free text fields (trim whitespace only, do NOT uppercase)
free_text_fields: []

# Deduplication key specification (Claim-line grain)
primary_key:
