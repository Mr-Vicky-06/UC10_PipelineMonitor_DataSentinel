  - PRCDR_DT21
  - PRCDR_DT22
  - PRCDR_DT23
  - PRCDR_DT24
  - PRCDR_DT25

# Identifier fields that MUST remain strings (preserve leading zeros, no arbitrary uppercase/changes)
