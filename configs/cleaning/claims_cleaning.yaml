  - CLM_ID
  - CLM_LINE_NUM
  - PRVDR_NUM
  - ORG_NPI_NUM
  - AT_PHYSN_UPIN
  - AT_PHYSN_NPI
  - OP_PHYSN_UPIN
  - OP_PHYSN_NPI
  - OT_PHYSN_UPIN
  - OT_PHYSN_NPI
  - FI_NUM
  - hospital_id
  - batch_id

# Healthcare code fields (preserve leading zeros, standardize casing)
