# DataSentinal — Authorization Data Quality Validation Rules (Layer 2 / Component 1)
# Evaluates Prior Authorization records

dataset_name: authorization
version: "1.0.0"
description: "Data quality validation contract and rule set for Prior Authorization dataset."

# ==============================================================================
# RULE GROUP A: COMPLETENESS
# ==============================================================================
completeness_rules:
  - id: DQ-AUTH-COMP-001
    name: mandatory_auth_id
    field: AUTH_ID
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Authorization ID (AUTH_ID) must never be null or blank."

  - id: DQ-AUTH-COMP-002
    name: mandatory_beneficiary_id
    field: BENE_ID
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Beneficiary ID (BENE_ID) must never be null or blank."

  - id: DQ-AUTH-COMP-003
    name: mandatory_physician_npi
    field: PRF_PHYSN_NPI
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Performing Physician NPI must never be null or blank."

  - id: DQ-AUTH-COMP-004
    name: mandatory_procedure_code
    field: HCPCS_CD
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Procedure Code (HCPCS_CD) must never be null or blank."

  - id: DQ-AUTH-COMP-005
    name: mandatory_effective_date
    field: AUTH_EFF_DT
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Authorization Effective Date must never be null or blank."

  - id: DQ-AUTH-COMP-006
    name: mandatory_expiration_date
    field: AUTH_EXP_DT
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Authorization Expiration Date must never be null or blank."

  - id: DQ-AUTH-COMP-007
    name: mandatory_authorized_amount
    field: AUTH_AMT
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Authorized Amount must never be null or blank."

  - id: DQ-AUTH-COMP-008
    name: mandatory_status_code
    field: AUTH_STATUS_CD
    threshold_null_pct: 0.0
    threshold_blank_pct: 0.0
    severity: ERROR
    description: "Authorization Status Code must never be null or blank."

# ==============================================================================
# RULE GROUP B: DUPLICATES / UNIQUENESS
# ==============================================================================
uniqueness_rules:
  - id: DQ-AUTH-DUP-001
    name: auth_id_uniqueness
    fields:
      - AUTH_ID
    threshold_duplicate_pct: 0.0
    severity: ERROR
    description: "Each authorization record identified by AUTH_ID must be strictly unique."

# ==============================================================================
# RULE GROUP C: FINANCIAL VALIDATION
# ==============================================================================
financial_rules:
  - id: DQ-AUTH-FIN-001
    name: non_negative_auth_amount
    field: AUTH_AMT
    allow_negative: false
    min_value: 0.0
    severity: ERROR
    description: "Authorized Amount must be non-negative (>= 0)."

# ==============================================================================
# RULE GROUP D & E: CLINICAL CODES (HCPCS)
# ==============================================================================
clinical_code_rules:
  - id: DQ-AUTH-CLIN-001
    name: auth_procedure_hcpcs_code_validity
    field: HCPCS_CD
    code_system: HCPCS/CPT
    reference_dataset: hcpcs_reference
    reference_field: code
    severity: WARNING
    on_missing_reference: REPORT_DEPENDENCY
    description: "Authorized HCPCS Procedure Code should be a valid code in procedure reference dictionary."

# ==============================================================================
# RULE GROUP F: DATE QUALITY
# ==============================================================================
date_logic_rules:
  - id: DQ-AUTH-DATE-001
    name: auth_effective_expiration_ordering
    from_date_field: AUTH_EFF_DT
    thru_date_field: AUTH_EXP_DT
    operator: "<="
    severity: ERROR
    description: "Authorization Effective Date (AUTH_EFF_DT) must precede or equal Expiration Date (AUTH_EXP_DT)."

# ==============================================================================
# RULE GROUP G: DOMAIN / VALIDITY
# ==============================================================================
validity_rules:
  - id: DQ-AUTH-VAL-001
    name: valid_auth_status_codes
    field: AUTH_STATUS_CD
    allowed_values:
      - APPROVED
      - DENIED
      - PENDING
    severity: WARNING
    description: "Authorization status must belong to standard approved domain values."

# ==============================================================================
# RULE GROUP H: SCHEMA VALIDATION GATE INTEGRATION
# ==============================================================================
schema_gate:
  enabled: true
  severity_on_fail: CRITICAL
  severity_on_warning: WARNING
  description: "Captures upstream structural Schema Validation status into authorization quality report."
